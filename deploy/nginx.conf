# Included inside the existing waiwai.is origin server block.
location = /remote/connect { return 308 /remote/connect/; }
location ^~ /remote/connect/ {
    proxy_pass http://127.0.0.1:8790/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    client_max_body_size 128k;
    access_log off;
}
location ^~ /remote/downloads/ {
    proxy_pass http://127.0.0.1:8790/downloads/;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
}
location ^~ /remote/updates/ {
    proxy_pass http://127.0.0.1:8790/updates/;
    proxy_set_header Host $host;
    proxy_cache off;
}
