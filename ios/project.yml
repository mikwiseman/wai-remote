name: WAIRemotePhone
options:
  bundleIdPrefix: is.wai.remote
  deploymentTarget:
    iOS: '17.0'
packages:
  WAIRemote:
    path: ..
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: R4A779QVVY
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.3.7
    CURRENT_PROJECT_VERSION: 68
targets:
  WAIRemotePhone:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - ../Sources/WAIRemote/GlassSurface.swift
      - ../Sources/WAIRemote/InvitationQR.swift
    dependencies:
      - package: WAIRemote
        product: RemoteCore
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.wai.remote.ios
        PRODUCT_NAME: WAI Remote
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  WAIRemotePhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Tests/WAIRemoteTests/InvitationQRCodeTests.swift
      - Tests
    dependencies:
      - target: WAIRemotePhone
      - package: WAIRemote
        product: RemoteCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: is.wai.remote.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WAI Remote.app/WAI Remote"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WAIRemotePhone:
    build:
      targets:
        WAIRemotePhone: all
    test:
      targets:
        - WAIRemotePhoneTests
