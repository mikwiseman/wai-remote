name: WAIRemotePhone
options:
  bundleIdPrefix: is.wai.remote
  deploymentTarget:
    iOS: '17.0'
packages:
  WAIRemote:
    path: ..
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: R4A779QVVY
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 2
targets:
  WAIRemotePhone:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    dependencies:
      - package: WAIRemote
        product: RemoteCore
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.wai.remote.ios
        PRODUCT_NAME: WAI Remote
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  WAIRemotePhone:
    build:
      targets:
        WAIRemotePhone: all
