name: Bounded encoder diagnostics
on:
  push:
    branches: [codex/encoder-budget-experiment]
permissions:
  contents: read
jobs:
  bandwidth-step:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify numeric diagnostic export
        run: python3 scripts/test-collect-bandwidth-diagnostics.py
      - name: Measure unchanged adaptive scenario once
        env:
          WAI_BANDWIDTH_STEP: '1'
          WAI_BANDWIDTH_MODE: diagnostic
          WAI_BANDWIDTH_OUTPUT: .runtime/bandwidth-experiment
        run: |
          mkdir -p .runtime/bandwidth-experiment
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            swift --version
          } > .runtime/bandwidth-experiment/environment.txt
          set -o pipefail
          swift test --jobs 2 --filter BandwidthStepBenchmarkTests 2>&1 | tee .runtime/bandwidth-experiment/test.log
      - name: Export numeric diagnostics only
        if: always()
        run: python3 scripts/collect-bandwidth-diagnostics.py .runtime/bandwidth-experiment
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandwidth-diagnostic-results
          path: |
            .runtime/bandwidth-experiment/*.json
            .runtime/bandwidth-experiment/*.png
            .runtime/bandwidth-experiment/test.log
            .runtime/bandwidth-experiment/environment.txt
            !.runtime/bandwidth-experiment/diagnostic-inputs.json
          include-hidden-files: true
          retention-days: 7
