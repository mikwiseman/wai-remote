name: Bounded encoder source baseline
on:
  push:
    branches: [codex/encoder-budget-experiment]
permissions:
  contents: read
jobs:
  bandwidth-step:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Profile source and run one 30s baseline
        env:
          WAI_BANDWIDTH_STEP: '1'
          WAI_BANDWIDTH_MODE: baseline
          WAI_BANDWIDTH_OUTPUT: .runtime/bandwidth-experiment
        run: |
          mkdir -p .runtime/bandwidth-experiment
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            swift --version
          } > .runtime/bandwidth-experiment/environment.txt
          set -o pipefail
          swift test --jobs 2 --filter BandwidthStepBenchmarkTests 2>&1 | tee .runtime/bandwidth-experiment/test.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandwidth-baseline-results
          path: .runtime/bandwidth-experiment/
          include-hidden-files: true
          retention-days: 7
